<!DOCTYPE html>
<html>
<head>
    <title>My Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: aliceblue;
            margin: 0; padding: 0;
        }
        button {
            background-color: green;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        input {
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 80%;
            font-size: 16px;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Expense Tracker</h1>
    <h2>Add A New Expense</h2>
    <div class="input-group">
        <input type="text" id="desc" placeholder="Item Name">
        <input type="number" id="amount" placeholder="Amount">
        <input type="date" id="dateInput">
        <br><br>
        <button onclick="saveExpense()">Save Expense</button>
    </div>
    <h2>Your History</h2>
    <table id="expenseTable">
        <thead>
            <tr>
                <th>Item</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
    <h3 style="margin-top: 20px; color: #333;">
        Total Spent: ₹<span id="totalAmount">0</span>
    </h3>
    <script>
        let localExpenses = JSON.parse(localStorage.getItem('expenses') || '[]');

        function renderAllExpenses(expenses) {
            let tableBody = document.getElementById("expenseTable").getElementsByTagName("tbody")[0];
            tableBody.innerHTML = "";
            let total = 0;
            for (let i = 0; i < expenses.length; i++) {
                let expense = expenses[i];
                addExpenseToTable(expense.item, expense.amount, expense.date);
                total += parseFloat(expense.amount || 0);
            }
            document.getElementById("totalAmount").innerHTML = total;
        }

        window.onload = function() {
            // 1. Immediately render from localStorage so data never vanishes
            if (localExpenses && localExpenses.length > 0) {
                renderAllExpenses(localExpenses);
            }

            // 2. Fetch from backend to sync with MongoDB
            fetch('/get_expenses')
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.json();
            })
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    localExpenses = data;
                    localStorage.setItem('expenses', JSON.stringify(data));
                    renderAllExpenses(data);
                } else if (localExpenses.length > 0) {
                    // Sync local offline data to backend
                    localExpenses.forEach(exp => {
                        fetch('/add_expense', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(exp)
                        });
                    });
                }
            })
            .catch(err => {
                console.log("Using local storage fallback:", err);
            });
        };

        function saveExpense() {
            let item = document.getElementById("desc").value.trim();
            let price = document.getElementById("amount").value.trim();
            let date = document.getElementById("dateInput").value;

            if (!date) {
                let today = new Date();
                date = today.toISOString().split('T')[0];
            }

            if(item === "" || price === "") {
                alert("Please fill in item name and amount!");
                return;
            }

            let expenseData = { item: item, amount: price, date: date };

            // Save locally
            localExpenses.push(expenseData);
            localStorage.setItem('expenses', JSON.stringify(localExpenses));
            
            // Update UI
            addExpenseToTable(item, price, date);
            let currentTotal = parseFloat(document.getElementById("totalAmount").innerHTML) || 0;
            document.getElementById("totalAmount").innerHTML = currentTotal + parseFloat(price);

            // Send to server
            fetch('/add_expense', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(expenseData)
            }).catch(e => console.log("Server sync failed, saved locally:", e));

            document.getElementById("desc").value = "";
            document.getElementById("amount").value = "";
        }

        function addExpenseToTable(item, price, date) {
            let tableBody = document.getElementById("expenseTable").getElementsByTagName("tbody")[0];
            let newRow = tableBody.insertRow();
            let cell1 = newRow.insertCell(0);
            let cell2 = newRow.insertCell(1);
            let cell3 = newRow.insertCell(2);
            cell1.innerHTML = item;
            cell2.innerHTML = "₹" + price;
            cell3.innerHTML = date || "-";
        }
    </script>
</body>
</html>
