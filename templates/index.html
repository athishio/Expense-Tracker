<!DOCTYPE html>
<html>
<head>
    <title>My Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: aliceblue;
            margin: 0; padding: 0;
        }
        button {
            background-color: green;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        input {
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 80%;
            font-size: 16px;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Expense Tracker</h1>
    <h2>Add A New Expense</h2>
    <div class="input-group">
        <input type="text" id="desc" placeholder="Item Name">
        <input type="number" id="amount" placeholder="Amount">
        <input type="date" id="dateInput">
        <br><br>
        <button onclick="saveExpense()">Save Expense</button>
    </div>
    <h2>Your History</h2>
    <table id="expenseTable">
        <thead>
            <tr>
                <th>Item</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
    <h3 style="margin-top: 20px; color: #333;">
        Total Spent: ₹<span id="totalAmount">0</span>
    </h3>
    <script>
        window.onload = function() {
            fetch('/get_expenses')
            .then(response => response.json())
            .then(data => {
                let total = 0;
                for (let i = 0; i < data.length; i++) {
                    let expense = data[i];
                    addExpenseToTable(expense.item, expense.amount, expense.date);
                    total += parseFloat(expense.amount);
                }
                document.getElementById("totalAmount").innerHTML = total;
            });
        };
        function saveExpense() {
            let item = document.getElementById("desc").value;
            let price = document.getElementById("amount").value;
            let date = document.getElementById("dateInput").value;
            if(item === "" || price === "") {
                alert("Please fill in all details!");
                return;
            }
            addExpenseToTable(item, price, date);
            let currentTotal = parseFloat(document.getElementById("totalAmount").innerHTML);
            document.getElementById("totalAmount").innerHTML = currentTotal + parseFloat(price);
            let expenseData = { item: item, amount: price, date: date };
            fetch('/add_expense', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(expenseData)
            });
            document.getElementById("desc").value = "";
            document.getElementById("amount").value = "";
        }
        function addExpenseToTable(item, price, date) {
            let tableBody = document.getElementById("expenseTable").getElementsByTagName("tbody")[0];
            let newRow = tableBody.insertRow();
            let cell1 = newRow.insertCell(0);
            let cell2 = newRow.insertCell(1);
            let cell3 = newRow.insertCell(2);
            cell1.innerHTML = item;
            cell2.innerHTML = "₹" + price;
            cell3.innerHTML = date;
        }
    </script>
</body>
</html>
